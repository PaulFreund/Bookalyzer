[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookalyzer"
version = "0.5.3"
description = "StoryScope-compatible per-segment narrative rarity analysis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "EbookLib>=0.18,<1",
  "google-genai>=1,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<23",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "reportlab>=4,<5",
]
faiss = ["faiss-cpu>=1.9,<2; platform_system != 'Windows'"]

[project.scripts]
bookalyzer = "bookanalyzer.cli:main"
bookanalyzer = "bookanalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["bookanalyzer*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
